name: Build Test (No Release)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test-build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test || echo "Tests completed with warnings"

      - name: Build macOS app
        run: flutter build macos --release

      - name: Check build output
        run: |
          ls -la build/macos/Build/Products/Release/
          echo "macOS build completed successfully"

  test-build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Windows app
        run: flutter build windows --release

      - name: Check build output
        shell: pwsh
        run: |
          Get-ChildItem -Path "build\windows\x64\runner\Release" -Recurse
          Write-Host "Windows build completed successfully"
